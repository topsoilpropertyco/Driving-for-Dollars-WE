name = "five-pointes-private"
main = "worker.js"
compatibility_date = "2026-09-20"

[assets]
directory = "./private_app"
binding = "ASSETS"

# Bindings are intentionally declared without account IDs, database IDs, bucket
# names, emails, tokens, or secrets. Provisioning fills these in outside Git.
[[d1_databases]]
binding = "DB"
database_name = "five-pointes-private"
# A syntactically valid all-zero UUID prevents accidental deployment while
# allowing Wrangler to validate and authenticate this unprovisioned project.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "TRACKS"
# This is a deliberately non-existent, syntactically valid placeholder.
bucket_name = "replace-after-private-provisioning"

# Cloudflare Access protects the Worker route before it reaches this code.
# Set ALLOWED_EMAILS as a Worker secret; never place household emails here.
