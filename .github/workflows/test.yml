name: Verify synthetic contracts

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "tests/**"
      - "docs/**"
      - "prototype.html"
      - "requirements.txt"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install declared spatial dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run synthetic contracts and geometry fixtures
        run: |
          python - <<'PY'
          import runpy
          paths = (
              'tests/test_prototype_contract.py',
              'tests/test_property_import.py',
              'tests/test_road_network.py',
          )
          for path in paths:
              module = runpy.run_path(path)
              for name in sorted(key for key in module if key.startswith('test_')):
                  module[name]()
              print(f'{path}: passed')
          PY
